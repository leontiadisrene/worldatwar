name: Ceasefire Tests (from tests folder)
on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run unit tests (ceasefire logic)
        run: python -m unittest tests.test_ceasefire_indicator -v

      - name: Run integration test (update.py pipeline)
        run: python -m unittest tests.test_update_integration -v
