name: Refresh conflict data
on:
  schedule:
    - cron: '17 0,12 * * *'
  workflow_dispatch:

concurrency:
  group: refresh-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install pinned dependencies 
        run: pip install -r requirements.txt
        
      - name: Refresh data
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python scripts/update.py

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || \
            git commit -m "chore: refresh conflict data $(date -u +%FT%TZ)"
          git pull --rebase -X ours origin main
          git push

      - name: Install pinned dependencies
        run: pip install -r requirements.txt

      - name: Verify queued dates (article text + free APIs)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}  # optional
          # REQUIRE_ARTICLE_PROOF: '1'  # uncomment to accept ONLY article-proven dates
        run: python scripts/verify_dates_free.py

      - name: Commit verified dates
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pending_dates.json data/history.json
          git diff --staged --quiet || \
            git commit -m "chore: resolve queued dates (article text + free APIs)"
          git push
